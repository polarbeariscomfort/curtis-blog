<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curtis Jones' Blog – Personal Challenge</title>
  <meta name="description" content="Curtis Jones' personal challenge: taking on more climate activism to help shift Cambridge towards plant-based food.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Animated leaf background (decorative) -->
  <canvas id="leaves" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="topbar">
      <nav class="sitenav" aria-label="Sections">
        <a href="#letter">Open letter</a>
        <a href="#updates">Updates</a>
        <a href="#resources">Resources</a>
      </nav>
      <div class="logos" id="logos"></div>
    </div>
    <div class="masthead">
      <p class="eyebrow" id="site-eyebrow">Personal Challenge</p>
      <h1 id="site-title">Curtis Jones' Blog</h1>
      <p class="subtitle" id="site-subtitle"></p>
      <p class="intro" id="site-intro"></p>
      <nav class="socials" id="socials" aria-label="Social links"></nav>
    </div>
  </header>

  <main>
    <!-- Open letter: contact to sign, with the letter attached -->
    <section class="cta-wrap" id="letter" aria-labelledby="cta-heading">
      <div class="letter-block">
        <div class="cta">
          <div class="cta-text">
            <p class="cta-kicker" id="cta-kicker"></p>
            <h2 id="cta-heading"></h2>
            <p id="cta-body"></p>
          </div>
          <div class="cta-side">
            <div class="cta-actions" id="cta-actions"></div>
            <p class="cta-email" id="cta-email"></p>
          </div>
        </div>
        <article class="letter" id="letter-card" aria-labelledby="letter-title">
          <h3 id="letter-title"></h3>
          <div class="letter-body is-collapsed" id="letter-body">
            <div id="letter-text"></div>
            <div class="letter-refs" id="letter-refs"></div>
          </div>
          <button class="letter-toggle" id="letter-toggle" type="button" aria-expanded="false" aria-controls="letter-body">
            <span>Read the full letter</span>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
          </button>
        </article>
      </div>
    </section>

    <!-- Updates feed -->
    <section class="feed" id="updates" aria-labelledby="updates-heading">
      <h2 class="section-title" id="updates-heading">Updates</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter posts by tag"></div>
      <div id="posts" aria-live="polite">
        <p class="status">Loading posts…</p>
      </div>
    </section>

    <!-- Resources -->
    <section class="resources" id="resources" aria-labelledby="resources-heading">
      <h2 class="section-title" id="resources-heading">Make the change yourself</h2>
      <p class="section-sub" id="resources-intro"></p>
      <div id="resource-groups"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <!-- Photo lightbox -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" id="lb-close" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next photo">›</button>
  </div>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/purify.min.js"></script>
  <script src="js/leaves.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
